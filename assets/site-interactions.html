<div id="swiss-progress" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  const SUN = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>`;

  const MOON = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
    </svg>`;

  const MOTION = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 12h6M14 12h6M8 8l4 4-4 4M16 8l-4 4 4 4"></path>
    </svg>`;

  const COMPACT = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>`;

  function safeGet(key) {
    try { return window.localStorage ? localStorage.getItem(key) : null; }
    catch (e) { return null; }
  }

  function safeSet(key, value) {
    try { if (window.localStorage) localStorage.setItem(key, value); }
    catch (e) {}
  }

  function button(id, label, icon) {
    const b = document.createElement("button");
    b.type = "button";
    b.id = id;
    b.className = "swiss-control";
    b.setAttribute("aria-label", label);
    b.title = label;
    b.innerHTML = icon + '<span class="swiss-control-label">' + label + "</span>";
    return b;
  }

  /* ----------------------------------------------------------
     CONTROL BAR
     ---------------------------------------------------------- */
  const controls = document.createElement("div");
  controls.className = "swiss-controls";
  controls.setAttribute("aria-label", "Display controls");

  const compactButton = button("swiss-compact-toggle", "Modo compacto", COMPACT);
  const motionButton = button("swiss-motion-toggle", "Reducir movimiento", MOTION);
  const themeButton = button("swiss-theme-toggle", "Modo oscuro", MOON);

  controls.append(compactButton, motionButton, themeButton);

  const navbar = document.querySelector(".navbar .navbar-container, .navbar .container-fluid, nav.navbar");
  if (navbar) {
    navbar.appendChild(controls);
  } else {
    controls.classList.add("swiss-floating");
    document.body.appendChild(controls);
  }

  /* ----------------------------------------------------------
     PERSISTED MODES
     ---------------------------------------------------------- */
  if (safeGet("swiss-compact") === "1") {
    document.body.classList.add("swiss-compact");
    compactButton.classList.add("is-on");
  }

  if (safeGet("swiss-no-motion") === "1") {
    document.body.classList.add("swiss-no-motion");
    motionButton.classList.add("is-on");
  }

  compactButton.addEventListener("click", function () {
    document.body.classList.toggle("swiss-compact");
    const on = document.body.classList.contains("swiss-compact");
    compactButton.classList.toggle("is-on", on);
    safeSet("swiss-compact", on ? "1" : "0");
  });

  motionButton.addEventListener("click", function () {
    document.body.classList.toggle("swiss-no-motion");
    const on = document.body.classList.contains("swiss-no-motion");
    motionButton.classList.toggle("is-on", on);
    safeSet("swiss-no-motion", on ? "1" : "0");

    if (on) {
      document.querySelectorAll(".swiss-reveal").forEach(function (el) {
        el.classList.add("swiss-shown");
      });
    } else {
      revealOnScroll();
    }
  });

  /* ----------------------------------------------------------
     THEME — use Quarto native toggle when available
     ---------------------------------------------------------- */
  function isDark() {
    return document.body.classList.contains("quarto-dark") ||
           document.documentElement.getAttribute("data-bs-theme") === "dark" ||
           document.body.classList.contains("swiss-force-dark");
  }

  function updateThemeIcon() {
    const dark = isDark();
    themeButton.innerHTML = (dark ? SUN : MOON) +
      '<span class="swiss-control-label">' + (dark ? "Modo claro" : "Modo oscuro") + "</span>";
    themeButton.title = dark ? "Modo claro" : "Modo oscuro";
    themeButton.setAttribute("aria-label", dark ? "Modo claro" : "Modo oscuro");
  }

  themeButton.addEventListener("click", function () {
    const nativeToggle = document.querySelector(".quarto-color-scheme-toggle");

    if (nativeToggle) {
      nativeToggle.click();
      window.setTimeout(updateThemeIcon, 80);
    } else {
      document.body.classList.toggle("swiss-force-dark");
      updateThemeIcon();
    }
  });

  updateThemeIcon();

  const classObserver = new MutationObserver(updateThemeIcon);
  classObserver.observe(document.body, { attributes: true, attributeFilter: ["class"] });
  classObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-bs-theme"] });

  /* ----------------------------------------------------------
     DYNAMIC LEFT TOC
     ---------------------------------------------------------- */
  const toc = document.querySelector("#TOC");
  const tocLinks = toc
    ? Array.from(toc.querySelectorAll('a[href^="#"]'))
    : [];

  const targets = tocLinks.map(function (link) {
    const href = link.getAttribute("href");
    if (!href || href === "#") return null;

    let target = null;
    try { target = document.querySelector(href); }
    catch (e) {}

    return target ? { link: link, target: target } : null;
  }).filter(Boolean);

  function tocScrollContainer() {
    if (!toc) return null;
    return toc.closest(".sidebar") || toc.parentElement;
  }

  let lastActive = null;

  function setActiveToc(item) {
    if (!item || item === lastActive) return;
    lastActive = item;

    tocLinks.forEach(function (link) {
      link.classList.remove("swiss-active");
      const li = link.closest("li");
      if (li) li.classList.remove("swiss-parent-active");
    });

    item.link.classList.add("swiss-active");

    let li = item.link.closest("li");
    while (li && toc && toc.contains(li)) {
      li.classList.add("swiss-parent-active");
      li = li.parentElement ? li.parentElement.closest("li") : null;
    }

    const scroller = tocScrollContainer();
    if (scroller) {
      const linkRect = item.link.getBoundingClientRect();
      const boxRect = scroller.getBoundingClientRect();
      const pad = 45;

      if (linkRect.top < boxRect.top + pad) {
        scroller.scrollTop -= (boxRect.top + pad - linkRect.top);
      } else if (linkRect.bottom > boxRect.bottom - pad) {
        scroller.scrollTop += (linkRect.bottom - (boxRect.bottom - pad));
      }
    }
  }

  function updateActiveToc() {
    if (!targets.length) return;

    const marker = Math.min(window.innerHeight * 0.31, 245);
    let current = targets[0];

    targets.forEach(function (item) {
      const rect = item.target.getBoundingClientRect();
      if (rect.top <= marker) current = item;
    });

    setActiveToc(current);
  }

  tocLinks.forEach(function (link) {
    link.addEventListener("click", function () {
      const match = targets.find(function (item) { return item.link === link; });
      if (match) setActiveToc(match);
    });
  });

  /* ----------------------------------------------------------
     FAIL-SAFE REVEAL ANIMATIONS
     Nothing is hidden until this JS has initialized.
     ---------------------------------------------------------- */
  const revealCandidates = Array.from(document.querySelectorAll(
    ".quarto-title-block, section.level2, .image-slot, .project-card, .skill-card, .download-card, .contact-card, .cell-output-display"
  ));

  revealCandidates.forEach(function (el) {
    el.classList.add("swiss-reveal");
  });

  function revealOnScroll() {
    const trigger = window.innerHeight * 0.91;

    revealCandidates.forEach(function (el) {
      if (document.body.classList.contains("swiss-no-motion")) {
        el.classList.add("swiss-shown");
        return;
      }

      const rect = el.getBoundingClientRect();
      if (rect.top < trigger) {
        el.classList.add("swiss-shown");
      }
    });
  }

  // Reveal visible content BEFORE activating hidden states.
  revealOnScroll();
  document.body.classList.add("swiss-js-ready");

  // Re-run immediately after activation so current viewport is guaranteed visible.
  revealOnScroll();

  /* ----------------------------------------------------------
     READING PROGRESS
     ---------------------------------------------------------- */
  const progress = document.getElementById("swiss-progress");

  function updateProgress() {
    if (!progress) return;
    const doc = document.documentElement;
    const scrollTop = window.pageYOffset || doc.scrollTop || 0;
    const max = Math.max(1, doc.scrollHeight - window.innerHeight);
    const pct = Math.max(0, Math.min(100, (scrollTop / max) * 100));
    progress.style.width = pct + "%";
  }

  /* ----------------------------------------------------------
     RAF SCROLL LOOP
     ---------------------------------------------------------- */
  let ticking = false;

  function onScroll() {
    if (ticking) return;
    ticking = true;

    window.requestAnimationFrame(function () {
      updateActiveToc();
      revealOnScroll();
      updateProgress();
      ticking = false;
    });
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);

  updateActiveToc();
  updateProgress();

  // Safety check after page/diagram layout settles.
  window.setTimeout(function () {
    revealOnScroll();
    updateActiveToc();
    updateProgress();
  }, 180);
})();
</script>
