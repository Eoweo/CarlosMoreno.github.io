<script>
(function () {
  "use strict";

  const SUN = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>`;

  const MOON = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
    </svg>`;

  const MOTION = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 12h6M14 12h6M8 8l4 4-4 4M16 8l-4 4 4 4"></path>
    </svg>`;

  const COMPACT = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>`;

  let revealTargets = [];
  let tocModel = null;
  let activeHeadingId = "";
  let ticking = false;

  function safeGet(key) {
    try {
      return window.localStorage ? localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (window.localStorage) localStorage.setItem(key, value);
    } catch (e) {}
  }

  function slugify(text) {
    return String(text || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "") || "section";
  }

  function isDark() {
    return (
      document.body.classList.contains("quarto-dark") ||
      document.body.classList.contains("swiss-manual-dark") ||
      document.documentElement.classList.contains("quarto-dark") ||
      document.documentElement.dataset.bsTheme === "dark"
    );
  }

  /* ============================================================
     NAVBAR
     ============================================================ */

  function fixNavbarRouting() {
    const brand = document.querySelector("#quarto-header .navbar-brand");
    const navLinks = Array.from(
      document.querySelectorAll("#quarto-header .navbar-nav .nav-link")
    );

    const portfolioLink = navLinks.find(function (link) {
      return (link.textContent || "").trim().toLowerCase() === "portfolio";
    });

    if (!brand) return;

    if (portfolioLink) {
      const portfolioHref = portfolioLink.getAttribute("href") || "portfolio.html";
      const homeHref = portfolioHref.replace(
        /portfolio(?:\.html)?(?:#.*)?$/,
        "index.html"
      );

      brand.setAttribute("href", homeHref);
    } else {
      brand.setAttribute("href", "index.html");
    }

    brand.setAttribute("title", "Home");
    brand.setAttribute("aria-label", "Carlos Moreno Rojas — Home");
  }

  /* ============================================================
     CONTROLS
     ============================================================ */

  function createControls() {
    if (document.querySelector(".swiss-controls")) return;

    const controls = document.createElement("div");
    controls.className = "swiss-controls";
    controls.setAttribute("aria-label", "Display controls");

    const compact = document.createElement("button");
    compact.type = "button";
    compact.className = "swiss-icon-button";
    compact.title = "Compact mode";
    compact.setAttribute("aria-label", "Toggle compact mode");
    compact.innerHTML = COMPACT;

    const motion = document.createElement("button");
    motion.type = "button";
    motion.className = "swiss-icon-button";
    motion.title = "Reduce motion";
    motion.setAttribute("aria-label", "Toggle reduced motion");
    motion.innerHTML = MOTION;

    const theme = document.createElement("button");
    theme.type = "button";
    theme.className = "swiss-icon-button";
    theme.setAttribute("aria-label", "Toggle light or dark mode");

    controls.append(compact, motion, theme);

    const host =
      document.querySelector("#quarto-header .navbar-container") ||
      document.querySelector("#quarto-header .container-fluid") ||
      document.querySelector("#quarto-header .navbar") ||
      document.body;

    host.appendChild(controls);

    if (safeGet("swiss-compact") === "1") {
      document.body.classList.add("swiss-compact");
      compact.classList.add("is-on");
    }

    if (safeGet("swiss-reduce-motion") === "1") {
      document.body.classList.add("swiss-reduce-motion");
      motion.classList.add("is-on");
    }

    compact.addEventListener("click", function () {
      document.body.classList.toggle("swiss-compact");
      const on = document.body.classList.contains("swiss-compact");
      compact.classList.toggle("is-on", on);
      safeSet("swiss-compact", on ? "1" : "0");
    });

    motion.addEventListener("click", function () {
      document.body.classList.toggle("swiss-reduce-motion");
      const on = document.body.classList.contains("swiss-reduce-motion");
      motion.classList.toggle("is-on", on);
      safeSet("swiss-reduce-motion", on ? "1" : "0");

      if (on) {
        revealTargets.forEach(function (el) {
          el.classList.add("swiss-shown");
        });
      } else {
        revealOnScroll();
      }
    });

    function updateThemeIcon() {
      const dark = isDark();
      theme.innerHTML = dark ? SUN : MOON;
      theme.title = dark ? "Light mode" : "Dark mode";
    }

    theme.addEventListener("click", function () {
      const nativeToggle = document.querySelector(".quarto-color-scheme-toggle");

      if (nativeToggle) {
        nativeToggle.click();
        window.setTimeout(updateThemeIcon, 80);
        return;
      }

      document.body.classList.toggle("swiss-manual-dark");
      const dark = document.body.classList.contains("swiss-manual-dark");
      safeSet("swiss-manual-dark", dark ? "1" : "0");
      updateThemeIcon();
    });

    if (
      !document.querySelector(".quarto-color-scheme-toggle") &&
      safeGet("swiss-manual-dark") === "1"
    ) {
      document.body.classList.add("swiss-manual-dark");
    }

    updateThemeIcon();

    try {
      const observer = new MutationObserver(updateThemeIcon);

      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["class", "data-bs-theme"]
      });

      observer.observe(document.body, {
        attributes: true,
        attributeFilter: ["class"]
      });
    } catch (e) {}
  }

  /* ============================================================
     FAIL-SAFE REVEAL
     ============================================================ */

  function collectRevealTargets() {
    const content =
      document.querySelector("main.content") ||
      document.querySelector("#quarto-document-content") ||
      document.querySelector("main");

    if (!content) return [];

    const candidates = content.querySelectorAll(
      [
        "h1:not(.title)",
        "h2",
        "h3",
        "p",
        ".image-slot",
        ".project-meta",
        ".skill-chips",
        ".project-grid",
        ".skill-grid",
        ".download-grid",
        ".contact-grid",
        ".home-metric-grid",
        ".home-step-grid",
        ".home-project-grid",
        ".cell",
        "table",
        "blockquote"
      ].join(",")
    );

    const result = [];
    const seen = new Set();

    candidates.forEach(function (el) {
      if (el.closest(".image-slot") && !el.classList.contains("image-slot")) return;
      if (seen.has(el)) return;

      seen.add(el);
      el.classList.add("swiss-reveal");
      result.push(el);
    });

    result.forEach(function (el, i) {
      el.style.setProperty("--swiss-delay", ((i % 4) * 24) + "ms");
    });

    return result;
  }

  function revealOnScroll() {
    if (!revealTargets.length) return;

    if (document.body.classList.contains("swiss-reduce-motion")) {
      revealTargets.forEach(function (el) {
        el.classList.add("swiss-shown");
      });
      return;
    }

    const trigger = window.innerHeight * 0.91;

    revealTargets.forEach(function (el) {
      if (el.classList.contains("swiss-shown")) return;

      if (el.getBoundingClientRect().top < trigger) {
        el.classList.add("swiss-shown");
      }
    });
  }

  function initReveal() {
    revealTargets = collectRevealTargets();

    revealTargets.forEach(function (el) {
      if (el.getBoundingClientRect().top < window.innerHeight * 0.97) {
        el.classList.add("swiss-shown");
      }
    });

    document.body.classList.add("swiss-js-ready");
    revealOnScroll();
  }

  /* ============================================================
     CUSTOM TOC FROM REAL HEADINGS
     This intentionally replaces the Quarto-generated TOC tree.
     ============================================================ */

  function getContentRoot() {
    return (
      document.querySelector("main.content") ||
      document.querySelector("#quarto-document-content") ||
      document.querySelector("main")
    );
  }

  function collectHeadings() {
    const content = getContentRoot();
    if (!content) return [];

    const headings = Array.from(
      content.querySelectorAll("h1:not(.title), h2, h3")
    ).filter(function (heading) {
      if (heading.closest("#title-block-header")) return false;
      if (heading.classList.contains("toc-ignore")) return false;
      if (heading.closest(".toc-ignore")) return false;
      return (heading.textContent || "").trim().length > 0;
    });

    const usedIds = new Set();

    headings.forEach(function (heading, index) {
      let id = heading.id;

      if (!id) {
        const base = slugify(heading.textContent);
        id = base;
        let suffix = 2;

        while (
          usedIds.has(id) ||
          (document.getElementById(id) && document.getElementById(id) !== heading)
        ) {
          id = base + "-" + suffix;
          suffix += 1;
        }

        heading.id = id;
      }

      usedIds.add(id);
    });

    return headings;
  }

  function buildHeadingTree(headings) {
    if (!headings.length) return [];

    const levels = headings.map(function (h) {
      return Number(h.tagName.substring(1));
    });

    const baseLevel = Math.min.apply(null, levels);
    const groups = [];

    let currentGroup = null;
    let currentChild = null;

    headings.forEach(function (heading) {
      const level = Number(heading.tagName.substring(1));

      const entry = {
        heading: heading,
        id: heading.id,
        text: (heading.textContent || "").trim(),
        level: level,
        children: [],
        parent: null,
        group: null,
        link: null,
        li: null
      };

      if (level <= baseLevel || !currentGroup) {
        currentGroup = entry;
        currentGroup.group = currentGroup;
        groups.push(currentGroup);
        currentChild = null;
        return;
      }

      if (level === baseLevel + 1) {
        entry.group = currentGroup;
        entry.parent = currentGroup;
        currentGroup.children.push(entry);
        currentChild = entry;
        return;
      }

      // H3 under H2 when base is H1.
      if (currentChild) {
        entry.group = currentGroup;
        entry.parent = currentChild;
        currentChild.children.push(entry);
      } else {
        // Safe fallback for unusual heading jumps.
        entry.group = currentGroup;
        entry.parent = currentGroup;
        currentGroup.children.push(entry);
      }
    });

    return groups;
  }

  function createTocLink(entry, className) {
    const link = document.createElement("a");
    link.className = "swiss-toc-link " + className;
    link.href = "#" + entry.id;
    link.textContent = entry.text;
    entry.link = link;

    link.addEventListener("click", function (event) {
      // Prevent a link inside <summary> from toggling the details twice.
      event.stopPropagation();
    });

    return link;
  }

  function renderTocGroup(group) {
    const details = document.createElement("details");
    details.className = "swiss-toc-group";
    group.details = details;

    const summary = document.createElement("summary");
    summary.appendChild(createTocLink(group, "swiss-toc-group-link"));
    details.appendChild(summary);

    if (!group.children.length) {
      // A title without subtitles behaves like a normal link.
      details.classList.add("swiss-toc-no-children");
      summary.addEventListener("click", function (event) {
        event.preventDefault();
        group.link.click();
      });
      return details;
    }

    const childrenList = document.createElement("ul");
    childrenList.className = "swiss-toc-children";

    group.children.forEach(function (child) {
      const li = document.createElement("li");
      li.className = "swiss-toc-subgroup";
      child.li = li;

      li.appendChild(createTocLink(child, "swiss-toc-child-link"));

      if (child.children.length) {
        const grandList = document.createElement("ul");
        grandList.className = "swiss-toc-grandchildren";

        child.children.forEach(function (grand) {
          const grandLi = document.createElement("li");
          grand.li = grandLi;
          grandLi.appendChild(
            createTocLink(grand, "swiss-toc-grand-link")
          );
          grandList.appendChild(grandLi);
        });

        li.appendChild(grandList);
      }

      childrenList.appendChild(li);
    });

    details.appendChild(childrenList);
    return details;
  }

  function getOrCreateTocContainer() {
    let toc = document.getElementById("TOC");
    if (toc) return toc;

    const margin =
      document.querySelector("#quarto-margin-sidebar") ||
      document.querySelector(".margin-sidebar") ||
      document.querySelector(".quarto-margin-sidebar");

    if (!margin) return null;

    toc = document.createElement("nav");
    toc.id = "TOC";
    toc.setAttribute("role", "doc-toc");
    margin.prepend(toc);

    return toc;
  }

  function buildCustomToc() {
    const toc = getOrCreateTocContainer();
    if (!toc) return null;

    const headings = collectHeadings();
    if (!headings.length) return null;

    const groups = buildHeadingTree(headings);
    if (!groups.length) return null;

    const originalTitle = toc.querySelector(".toc-title");
    const titleText = originalTitle
      ? originalTitle.textContent.trim()
      : "ON THIS PAGE";

    const nodeById = new Map();

    groups.forEach(function addNodes(group) {
      nodeById.set(group.id, group);

      group.children.forEach(function (child) {
        nodeById.set(child.id, child);

        child.children.forEach(function (grand) {
          nodeById.set(grand.id, grand);
        });
      });
    });

    const fragment = document.createDocumentFragment();

    const title = document.createElement("div");
    title.className = "toc-title";
    title.textContent = titleText;
    fragment.appendChild(title);

    const root = document.createElement("div");
    root.className = "swiss-toc-root";

    groups.forEach(function (group) {
      root.appendChild(renderTocGroup(group));
    });

    fragment.appendChild(root);

    // Only replace the native TOC after our own tree is completely built.
    toc.replaceChildren(fragment);

    return {
      toc: toc,
      headings: headings,
      groups: groups,
      nodeById: nodeById
    };
  }

  function getActiveHeading() {
    if (!tocModel || !tocModel.headings.length) return null;

    const marker = Math.min(170, window.innerHeight * 0.25);
    let active = tocModel.headings[0];

    tocModel.headings.forEach(function (heading) {
      if (heading.getBoundingClientRect().top <= marker) {
        active = heading;
      }
    });

    return active;
  }

  function findActiveChild(node) {
    if (!node) return null;

    if (node.parent && node.parent.group === node.parent) {
      return node;
    }

    if (node.parent && node.parent.parent) {
      return node.parent;
    }

    return null;
  }

  function keepTocLinkVisible(link) {
    if (!tocModel || !link) return;

    const toc = tocModel.toc;
    const tocRect = toc.getBoundingClientRect();
    const linkRect = link.getBoundingClientRect();
    const margin = 44;

    if (linkRect.bottom > tocRect.bottom - margin) {
      toc.scrollTo({
        top: toc.scrollTop + (linkRect.bottom - tocRect.bottom + margin),
        behavior: document.body.classList.contains("swiss-reduce-motion")
          ? "auto"
          : "smooth"
      });
    } else if (linkRect.top < tocRect.top + margin) {
      toc.scrollTo({
        top: Math.max(
          0,
          toc.scrollTop - (tocRect.top + margin - linkRect.top)
        ),
        behavior: document.body.classList.contains("swiss-reduce-motion")
          ? "auto"
          : "smooth"
      });
    }
  }

  function updateCustomToc() {
    if (!tocModel) return;

    const activeHeading = getActiveHeading();
    if (!activeHeading) return;

    const node = tocModel.nodeById.get(activeHeading.id);
    if (!node) return;

    const group = node.group || node;
    const activeChild = findActiveChild(node);

    // Native <details>.open is the robust source of truth.
    tocModel.groups.forEach(function (candidate) {
      if (candidate.details) {
        candidate.details.open = candidate === group;
      }

      candidate.children.forEach(function (child) {
        if (child.li) {
          child.li.classList.toggle(
            "swiss-sub-open",
            candidate === group && child === activeChild
          );
        }
      });
    });

    // Exact active subtitle/title.
    tocModel.nodeById.forEach(function (candidate) {
      if (candidate.link) {
        candidate.link.classList.toggle(
          "swiss-active",
          candidate.id === node.id
        );
      }
    });

    if (node.id !== activeHeadingId) {
      activeHeadingId = node.id;

      window.requestAnimationFrame(function () {
        keepTocLinkVisible(node.link);
      });
    }
  }

  /* ============================================================
     MAIN
     ============================================================ */

  function onScroll() {
    if (ticking) return;
    ticking = true;

    window.requestAnimationFrame(function () {
      revealOnScroll();
      updateCustomToc();
      ticking = false;
    });
  }

  function init() {
    fixNavbarRouting();
    createControls();
    initReveal();

    tocModel = buildCustomToc();
    updateCustomToc();

    window.addEventListener("scroll", onScroll, { passive: true });

    window.addEventListener("resize", function () {
      revealOnScroll();
      updateCustomToc();
    });

    // Re-check after layout-sensitive content such as Mermaid has settled.
    window.setTimeout(function () {
      revealOnScroll();
      updateCustomToc();
    }, 250);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
