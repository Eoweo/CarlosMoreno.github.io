<div id="swiss-controls" aria-label="Display options">
  <button class="swiss-control" id="swiss-density" type="button"
          title="Compact layout" aria-label="Compact layout" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <button class="swiss-control" id="swiss-motion" type="button"
          title="Reduce motion" aria-label="Reduce motion" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 12h6M14 12h6M8 8l4 4-4 4M16 8l-4 4 4 4"></path>
    </svg>
  </button>

  <button class="swiss-control" id="swiss-theme" type="button"
          title="Dark mode" aria-label="Toggle light and dark mode">
  </button>
</div>

<script>
(function () {
  "use strict";

  const SUN = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>`;

  const MOON = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
    </svg>`;

  const body = document.body;
  const densityButton = document.getElementById("swiss-density");
  const motionButton = document.getElementById("swiss-motion");
  const themeButton = document.getElementById("swiss-theme");

  function safeGet(key) {
    try {
      return window.localStorage ? localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (window.localStorage) localStorage.setItem(key, value);
    } catch (e) {}
  }

  function isDark() {
    return body.classList.contains("quarto-dark") ||
           document.documentElement.getAttribute("data-bs-theme") === "dark" ||
           document.documentElement.classList.contains("quarto-dark");
  }

  function updateThemeIcon() {
    if (!themeButton) return;
    const dark = isDark();
    themeButton.innerHTML = dark ? SUN : MOON;
    themeButton.title = dark ? "Light mode" : "Dark mode";
    themeButton.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }

  if (themeButton) {
    themeButton.addEventListener("click", function () {
      const nativeToggle = document.querySelector(".quarto-color-scheme-toggle");
      if (nativeToggle) {
        nativeToggle.click();
        window.setTimeout(updateThemeIcon, 60);
        window.setTimeout(updateThemeIcon, 180);
      }
    });
  }

  // Keep the icon synchronized if Quarto changes the theme.
  try {
    const observer = new MutationObserver(updateThemeIcon);
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["class", "data-bs-theme"]
    });
    observer.observe(body, {
      attributes: true,
      attributeFilter: ["class"]
    });
  } catch (e) {}

  // Compact mode
  const compactSaved = safeGet("swiss-compact") === "1";
  if (compactSaved) {
    body.classList.add("compact-layout");
    if (densityButton) {
      densityButton.classList.add("on");
      densityButton.setAttribute("aria-pressed", "true");
    }
  }

  if (densityButton) {
    densityButton.addEventListener("click", function () {
      body.classList.toggle("compact-layout");
      const on = body.classList.contains("compact-layout");
      densityButton.classList.toggle("on", on);
      densityButton.setAttribute("aria-pressed", on ? "true" : "false");
      safeSet("swiss-compact", on ? "1" : "0");
      revealVisible();
    });
  }

  // Reduced motion mode
  const motionSaved = safeGet("swiss-reduce-motion") === "1";
  if (motionSaved) {
    body.classList.add("reduce-motion");
    if (motionButton) {
      motionButton.classList.add("on");
      motionButton.setAttribute("aria-pressed", "true");
    }
  }

  if (motionButton) {
    motionButton.addEventListener("click", function () {
      body.classList.toggle("reduce-motion");
      const on = body.classList.contains("reduce-motion");
      motionButton.classList.toggle("on", on);
      motionButton.setAttribute("aria-pressed", on ? "true" : "false");
      safeSet("swiss-reduce-motion", on ? "1" : "0");

      if (on) {
        document.querySelectorAll(".swiss-reveal").forEach(function (el) {
          el.classList.add("shown");
        });
      } else {
        revealVisible();
      }
    });
  }

  // ---------------------------------------------------------
  // FAIL-SAFE REVEAL
  // Elements are visible in CSS by default.
  // We add the animation state only after JS has initialized.
  // ---------------------------------------------------------
  const targets = Array.from(document.querySelectorAll(
    "main.content > section.level1, " +
    "main.content > section.level2, " +
    ".image-slot, .project-card, .skill-card, .download-card, .contact-card"
  ));

  targets.forEach(function (el) {
    el.classList.add("swiss-reveal");
  });

  function revealVisible() {
    if (body.classList.contains("reduce-motion")) {
      targets.forEach(function (el) { el.classList.add("shown"); });
      return;
    }

    const trigger = window.innerHeight * 0.91;

    targets.forEach(function (el) {
      const rect = el.getBoundingClientRect();
      if (rect.top < trigger) {
        el.classList.add("shown");
      }
    });
  }

  // First mark visible content before animation can hide anything.
  revealVisible();

  // Only now enable hidden pending states.
  body.classList.add("swiss-js-ready");

  let ticking = false;
  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(function () {
        revealVisible();
        ticking = false;
      });
      ticking = true;
    }
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", revealVisible);

  // Extra safety after fonts/layout settle.
  window.setTimeout(revealVisible, 120);
  window.setTimeout(revealVisible, 450);

  updateThemeIcon();
})();
</script>
