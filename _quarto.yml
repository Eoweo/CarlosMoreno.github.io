project:
  type: website
  output-dir: _site
website:
  title: Carlos Moreno Rojas
  description: Biomedical & Electrical Engineering — Portfolio
  navbar:
    left:
    - href: portfolio.qmd
      text: Portfolio
    - href: cv.qmd
      text: CV
    - href: contact.qmd
      text: Contact
  page-footer:
    left: Carlos Moreno Rojas
    right: Biomedical & Electrical Engineering
  search: false
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/site.css
    toc: true
    toc-location: left
    toc-depth: 3
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    include-after-body: assets/site-scripts.html
    page-layout: full
    toc-expand: 1
    grid:
      sidebar-width: 300px
      body-width: 1600px
      margin-width: 100px
      gutter-width: 0.75rem
execute:
  freeze: auto
